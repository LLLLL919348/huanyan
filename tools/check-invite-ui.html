<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!--
  邀请制前端验收（站点真的跑在 iframe 里，不是纸上推演）：
    ① 未开启邀请制时：输入框正常、没有任何「邀请码」入口（没开就不该打扰访客）
    ② 开启 + 本机无凭证：对话区出现「本站为邀请制」面板，且**没有** textarea / 发送按钮
    ③ 顶栏出现「邀请码」按钮
    ④ 发一条消息会被拦住（不产生请求）
    ⑤ 输入正确邀请码后：面板消失、输入框回来、顶栏按钮变成「已通过」
    ⑥ 通过之后再发消息，请求能正常发出去（不是 403）
    ⑦ 凭证过期（把本地凭证改坏）后重新载入：又回到锁定状态

  前置：后端已设置 ADMIN_TOKEN，且站点在 127.0.0.1 上跑。
  用法： powershell -File tools/run-smoke.ps1 check-invite-ui 40000 5599
-->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };
let fails = 0;
function ok(cond, label, extra) { if (cond) P('  ✓ ' + label); else { fails++; P('  ✗ ' + label + (extra ? ' — ' + extra : '')); } }

const TOKEN = 'dev-token-invite-check';       // 与启动服务时的 ADMIN_TOKEN 一致
/* 管理接口不求人：每一步都断言成功，失败就当场抛错 —— 不然"没开关成功"会被当成
   "邀请制没生效"，最后查半天是令牌写错了（第一版就踩了）。 */
async function admin(body) {
  const r = await fetch('/api/invite-admin', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN },
    body: JSON.stringify(body)
  });
  const dd = await r.json().catch(function () { return null; });
  if (!r.ok || !dd || !dd.ok) {
    throw new Error('管理接口 ' + (body.action || '?') + ' 失败：HTTP ' + r.status + ' ' + ((dd && dd.error) || ''));
  }
  return dd;
}

document.getElementById('f').addEventListener('load', function () {
  /* ★ iframe 每次 reload 都会再次触发这个 load 回调。不设防的话测试会递归重跑
     （同一份日志出现三遍、几个"运行"互相开关邀请制，结果全是噪声）。
     用父窗口上的一个标记保证只跑一次。 */
  if (window.__inviteUiStarted) return;
  window.__inviteUiStarted = true;
  const f = document.getElementById('f');
  /* ★ 不能用一次性的 w/d：iframe reload 之后旧文档对象会被卸载（contentDocument 变成
     about:blank 之类），拿着它查 DOM 永远查不到东西 —— 第一版就栽在这里。
     所以每次访问都重新取当前窗口与文档。 */
  const W = () => f.contentWindow;
  const D = () => f.contentDocument;
  const w = W(), d = D();
  w.addEventListener('error', function (e) { log.push('!! error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); fails++; });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const composer = () => D().getElementById('composer');
  const panel = () => composer().querySelector('.locked-panel.invite');
  const inviteBtn = () => D().getElementById('btnInvite');

  /* 打开一个可玩的本子，停在对话页 */
  async function openChat() {
    for (let i = 0; i < 80 && !D().querySelector('.res-card'); i++) await wait(200);
    const win = W();
    const list = win.RP.resources.list();
    const res = list.filter(function (r) { return r.status === 'playable'; })[0] || list[0];
    win.RP.app.play(res.id);
    await wait(700);
    return { res, conv: win.RP.store.active() };
  }
  /* 重新载入 iframe：模拟「关掉浏览器再回来」——凭证在 localStorage / Cookie 里，应当被记住。
     注意 iframe 里的 RP/文档对象在 reload 后全是新的，所以后面一律用 W()/D() 现取。 */
  function reload() {
    return new Promise(function (resolve) {
      f.addEventListener('load', function on() { f.removeEventListener('load', on); resolve(); }, { once: true });
      W().location.reload();
    });
  }
  /* 等页面重新启动完成（资源渲染出来 = boot 跑完了） */
  async function ready(ms) {
    const t0 = Date.now();
    while (Date.now() - t0 < (ms || 10000)) {
      try { if (W().RP && W().RP.app && D().querySelector('.res-card')) return true; } catch (e) { }
      await wait(200);
    }
    return false;
  }

  (async function () {
    try {
      /* 先用管理接口保证起点干净：关闭邀请制 */
      await admin({ action: 'toggle', enabled: false });

      P('【① 未开启邀请制：不该有任何拦截】');
      let ctx = await openChat();
      ok(!panel(), '对话区没有邀请制面板');
      ok(!!composer().querySelector('#chatInput'), '输入框正常存在');
      ok(!inviteBtn() || inviteBtn().style.display === 'none', '顶栏不显示「邀请码」按钮',
        inviteBtn() ? 'display=' + inviteBtn().style.display : '（无此按钮）');

      P('【② 开启邀请制后重新载入：无凭证必须被挡住】');
      const made = await admin({ action: 'create', count: 1, days: 7, note: 'ui 验收' });
      const CODE = made.made[0];
      const CODE_ID = made.invite.codes[0].id;
      await admin({ action: 'toggle', enabled: true });
      /* 清掉本地可能残留的凭证，保证这一轮是"第一次来"的人 */
      try { W().localStorage.removeItem('rp_invite_grant'); W().localStorage.removeItem('rp_invite_grant_exp'); } catch (e) { }
      /* 清 Cookie：服务端凭证挂在 Cookie 上，用 document.cookie 过期掉它 */
      try { D().cookie = 'rp_invite=; Path=/; Max-Age=0'; } catch (e) { }
      await reload();
      await ready();

      ctx = await openChat();
      ok(!!panel(), '对话区出现「本站为邀请制」面板', panel() ? '' : composer().innerHTML.slice(0, 120));
      ok(!composer().querySelector('#chatInput'), '没有输入框');
      ok(!composer().querySelector('#btnSend'), '没有发送按钮');
      ok(!!composer().querySelector('#btnInviteOpen'), '面板上有「输入邀请码」按钮');
      ok(!!inviteBtn() && inviteBtn().style.display !== 'none', '顶栏出现「邀请码」按钮');
      ok(w.RP.invite.locked() === true, 'RP.invite.locked() 为真');

      P('【③ 锁定状态下直接发消息：必须被拦住，不发请求】');
      let chatCalls = 0;
      const realFetch = W().fetch;
      const guardFetch = function (url) {
        if (String(url).indexOf('/api/chat') !== -1) { chatCalls++; return Promise.reject(new Error('不该发出去')); }
        return realFetch.apply(W(), arguments);
      };
      W().fetch = guardFetch;
      await W().RP.chat.sendMessage(ctx.conv, ctx.res, '我想说话', {});
      await wait(200);
      W().fetch = realFetch;
      ok(chatCalls === 0, '没有向 /api/chat 发出任何请求', '实际 ' + chatCalls + ' 次');

      P('【④ 输入正确邀请码】');
      await W().RP.api.redeemInvite(CODE);
      W().RP.invite.paint();
      W().RP.chat.render();
      await wait(400);
      ok(W().RP.invite.locked() === false, '兑换后 locked() 为假');
      ok(!panel(), '邀请制面板消失');
      ok(!!composer().querySelector('#chatInput'), '输入框回来了');
      ok(!!composer().querySelector('#btnSend'), '发送按钮回来了');
      ok(!!inviteBtn() && inviteBtn().classList.contains('ok'), '顶栏按钮变成「已通过」样式',
        inviteBtn() ? inviteBtn().className : '');

      P('【⑤ 通过之后真的能发出去（用伪造 SSE，不真调模型）】');
      let sent = 0, grantSeen = false;
      const sseFetch = function (url, opts) {
        if (String(url).indexOf('/api/chat') === -1) return realFetch.apply(W(), arguments);
        sent++;
        const hdr = (opts && opts.headers) || {};
        if (hdr['x-invite-grant']) grantSeen = true;
        const REPLY = '（她抬眼看你）你来了。\n<<<STATE {"hp":0,"affinity":1,"progress":5,"flag":"none","reason":"初遇"}>>>';
        /* ★ new 后面必须是真正的构造函数：W() 是箭头函数，`new W().TextEncoder()`
           会先对箭头函数求 new → "W is not a constructor"（第一版就踩了）。
           所以先把窗口取出来存进变量。 */
        const win = W();
        const enc = new win.TextEncoder();
        const stream = new win.ReadableStream({
          start: function (ctrl) { ctrl.enqueue(enc.encode('data: {"t":"","ping":true}\n\n')); },
          pull: function (ctrl) { return new Promise(function (res) { setTimeout(function () { ctrl.enqueue(enc.encode('data: ' + JSON.stringify({ done: true, text: REPLY }) + '\n\n')); ctrl.close(); res(); }, 10); }); }
        });
        return Promise.resolve(new win.Response(stream, { status: 200, headers: { 'Content-Type': 'text/event-stream; charset=utf-8' } }));
      };
      W().fetch = sseFetch;
      await W().RP.chat.sendMessage(ctx.conv, ctx.res, '我来了。', {});
      await wait(900);
      W().fetch = realFetch;
      ok(sent === 1, '通过后消息正常发出（1 次请求）', '实际 ' + sent + ' 次');
      ok(grantSeen, '对话请求带上了 x-invite-grant 头（Cookie 被拦时的兜底）');
      const last = (W().RP.store.active().messages || []).filter(function (m) { return m.role === 'ai'; }).slice(-1)[0];
      ok(!!(last && /她抬眼看你/.test(last.text)), '角色回复进了气泡', last ? last.text.slice(0, 30) : '（没有 ai 消息）');

      P('【⑥ 凭证被作废后：重新载入又回到锁定】');
      await admin({ action: 'update', id: CODE_ID, disabled: true });
      await reload();
      await ready();
      ctx = await openChat();
      ok(W().RP.invite.locked() === true, '停用邀请码后同一浏览器又被挡住');
      ok(!!panel(), '面板重新出现');

      await admin({ action: 'toggle', enabled: false });
      await admin({ action: 'delete', id: CODE_ID });
      P('  （已恢复：邀请制关闭 + 删除验收码）');

      P('');
      P(fails === 0 ? '=== 全部通过 ===' : '=== 失败 ' + fails + ' 项 ===');
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); P('=== 完成 ==='); }
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
