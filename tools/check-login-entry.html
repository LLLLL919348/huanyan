<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 登录入口验收：顶栏按钮 + 资料页按钮 + 弹窗能否打开 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; let fails = 0;
const P = s => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };
function ok(c, label, extra) { if (c) P('  ✓ ' + label); else { fails++; P('  ✗ ' + label + (extra ? ' — ' + extra : '')); } }
const f = document.getElementById('f');
f.addEventListener('load', function () {
  if (window.__s) return; window.__s = 1;
  const w = f.contentWindow, d = f.contentDocument;
  const errs = [];
  w.addEventListener('error', e => errs.push(String(e.message)));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async function () {
    try {
      for (let i = 0; i < 80 && !d.querySelector('.res-card'); i++) await wait(200);

      P('【① 顶栏登录入口】');
      const chip = d.getElementById('btnLogin');
      ok(!!chip, '顶栏有登录按钮');
      ok(!!chip && chip.offsetParent !== null, '按钮可见（不是 display:none）');
      ok(!!chip && /登录/.test(chip.textContent), '文案是「登录」', chip ? chip.textContent.trim() : '');
      const cs = chip ? w.getComputedStyle(chip) : null;
      ok(!!cs && Number(cs.height.replace('px', '')) >= 26, '按钮有实际高度', cs ? cs.height : '');

      P('【② 点顶栏登录 → 弹窗】');
      if (chip) chip.click();
      await wait(500);
      let mask = d.getElementById('authMask');
      ok(!!mask, '弹出了登录面板');
      ok(!!mask && !!d.getElementById('authEmail'), '面板里有邮箱输入框');
      ok(!!mask && !!d.getElementById('authSend'), '面板里有「发送验证码」');
      if (mask) { const btn = d.querySelector('#authPrivacy'); if (btn) { } mask.remove(); }
      document.documentElement.style && (d.documentElement.style.overflow = '');

      P('【③ 资料页的登录按钮】');
      w.RP.app.setView('profile');
      await wait(400);
      const pf = d.querySelector('#pfLogin');
      ok(!!pf, '资料页有「登录」按钮');
      if (pf) pf.click();
      await wait(500);
      mask = d.getElementById('authMask');
      ok(!!mask, '点资料页的登录也能弹出面板');

      P('【④ 掩码邮箱 / 未登录态】');
      const info = w.RP.auth.info();
      ok(info.me === null, '当前是未登录状态', JSON.stringify(info.me));

      P('');
      P(errs.length ? ('⚠ 页面 JS 报错：' + errs.join(' | ')) : '（没有 JS 报错）');
      P(fails === 0 ? '=== 全部通过 ===' : '=== 失败 ' + fails + ' 项 ===');
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); P('=== 完成 ==='); }
    document.title = 'DONE';
  })();
});
</script>
</body></html>
