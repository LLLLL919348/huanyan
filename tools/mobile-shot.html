<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>shot</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b1f;overflow:hidden}
  .wrap{display:flex;justify-content:center;align-items:flex-start;height:100%}
  /* 真正的 390×844 手机视口：窗口最小宽度被 Chromium 限制在 470，所以用 iframe 精确定宽 */
  iframe{width:390px;height:844px;border:0;background:#fff;outline:1px solid #444}
</style></head>
<body>
<div class="wrap"><iframe id="f" src="../index.html"></iframe></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'res';
const lock = new URLSearchParams(location.search).get('lock') === '1';
const f = document.getElementById('f');
f.addEventListener('load', function () {
  const w = f.contentWindow, d = f.contentDocument;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async function () {
    for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
    /* lock=1：把界面切到「邀请制未通过」的样子（服务端开关决定 enabled，这里只影响显示）。
       用来核对锁定面板在窄屏上的排版 —— 不需要真的开邀请制。 */
    if (lock) {
      const gate = w.RP.api.inviteInfo();
      if (gate) { gate.checked = true; gate.enabled = true; gate.unlocked = false; gate.days = 90; gate.reason = ''; }
      w.RP.invite.paint();
      const list0 = w.RP.resources.playable();
      if (list0 && list0.length) w.RP.app.play(list0[0].id);
      await wait(900);
      w.RP.chat.render();
    }
    if (v === 'profile') {
      const st = w.RP.store.get(); st.ui.view = 'profile'; w.RP.store.save(); w.RP.app.setView('profile');
    }
    if (v === 'nomodel') {
      w.RP.api.mode = function () { return 'none'; };
      w.RP.api.serverInfo = function () { return { serverModel: false, model: '', local: false, dailyQuota: 20, quota: null }; };
      const list = w.RP.resources.playable();
      if (list && list.length) w.RP.app.play(list[0].id);
      await wait(700);
      if (w.RP.chat.renderComposer) w.RP.chat.renderComposer();
    }
    if (v === 'chat') {
      /* 真机截图里的场景：刚进一个本子（有剧情提醒卡与「本场规则已隐藏」），看竖向空间够不够 */
      const list = w.RP.resources.playable();
      const pick = list.filter(function (r) { return r.id === 'yuye-zhensuo'; })[0] || list[0];
      if (pick) w.RP.app.play(pick.id);
      await wait(900);
    }
    await wait(800);
    document.title = 'SHOT';
  })();
});
</script>
</body>
</html>
