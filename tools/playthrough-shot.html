<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>shot</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100vw;height:100vh;border:0;display:block}</style></head>
<body>
<!-- 试玩截图：把 tools/report-sink.js 收到的那一场真实会话取回来，注入 store 再渲染。
     这样截图不碰网络、不需要真实时间，虚拟时间下也能稳定出图。 -->
<iframe id="f" src="../index.html"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', function () {
  const w = f.contentWindow, d = f.contentDocument;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async function () {
    let conv = null;
    try {
      /* 必须用取景页自己的 fetch：iframe 里的站点用的是严格 CSP（connect-src 'self'），
         在那边发跨端口请求会被拦掉。取景页在 /tools/ 下，CSP 已放开 5799。 */
      const r = await fetch('http://127.0.0.1:5799/conv', { cache: 'no-store' });
      if (r.ok) conv = await r.json();
    } catch (e) { }
    for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
    if (!conv) { document.title = 'NO-CONV'; return; }

    const st = w.RP.store.get();
    /* 造一条与快照同 id 的会话，直接落到 store 里 */
    const seeded = {
      id: 'conv-playthrough', kind: 'roleplay', resourceId: conv.resourceId, title: '长安夜未央',
      hp: conv.hp, maxHp: conv.maxHp, affinity: conv.affinity, progress: conv.progress,
      turn: conv.turn, warned: conv.warned, muted: !!conv.muted, left: !!conv.left, paused: !!conv.paused,
      messages: conv.messages, createdAt: Date.now() - 600000, updatedAt: Date.now()
    };
    st.convs = st.convs.filter(function (c) { return c.kind !== 'roleplay'; }).concat([seeded]);
    st.activeConv = seeded.id;
    st.ui.view = 'chat';
    w.RP.store.save();
    w.RP.app.setView('chat');
    for (let i = 0; i < 40 && !d.querySelector('#messages .msg-row'); i++) await wait(200);
    const box = d.getElementById('messages');
    if (box) box.scrollTop = box.scrollHeight;
    await wait(600);
    if (box) box.scrollTop = box.scrollHeight;
    await wait(400);
    document.title = 'SHOT';
  })();
});
</script>
</body>
</html>
