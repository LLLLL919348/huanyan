<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 全资源巡检：逐个可玩本子开场 + 一次对话，检查提醒卡分组、行为台词与异常 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 测试专用：产品里没有模型就不允许对话，这里显式打开离线演绎当"假模型" */
  w.RP.engine.enableOfflineForHarness(true);
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); });
  w.addEventListener('error', function (e) { log.push('!! error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  async function send(text) {
    const ta = d.getElementById('chatInput');
    if (!ta) return false;
    ta.value = text; ta.dispatchEvent(new w.Event('input'));
    d.getElementById('btnSend').click();
    await wait(2200); return true;
  }
  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
      const list = (w.RP_RESOURCES || []).filter(function (r) { return r.status === 'playable'; });
      P('可玩资源 ' + list.length + ' 个：' + list.map(function (r) { return r.name; }).join('、'));
      P('');
      for (const r of list) {
        const before = d.querySelectorAll('.execution, .reminder').length;
        w.RP.app.play(r.id);
        await wait(600);
        const c = conv();
        const card = Array.from(d.querySelectorAll('.reminder')).slice(-1)[0];
        const groups = card ? card.querySelectorAll('.rule-group').length : 0;
        const plotN = card ? card.querySelectorAll('.rule-group.plot li').length : 0;
        const behN = card ? card.querySelectorAll('.rule-group.behavior li').length : 0;
        const items = card ? card.querySelectorAll('ol li').length : 0;
        /* 用开场建议里的一条发一句，看是否正常回 */
        const hint = (r.openingHints || [])[0] || '（我看着他不说话）';
        const ok = await send(hint);
        const aiEl = Array.from(d.querySelectorAll('.msg-row.ai .bubble')).slice(-1)[0];
        const aiText = aiEl ? aiEl.textContent : '';
        P('【' + r.name + '】' + r.character.name + ' (' + r.rating + '/' + r.powerBalance + '/难度' + r.difficulty + ')');
        P('   提醒卡：剧情提醒 ' + items + ' 条 · 规则分组 ' + groups + ' 个（剧情 ' + plotN + ' / 行为 ' + behN + '）');
        P('   首轮能否回复：' + (ok && aiText.length > 20 ? '✅ ' + aiText.length + ' 字' : '❌'));
        P('   回复开头：' + JSON.stringify(aiText.slice(0, 52)));
        P('   状态：hp=' + c.hp + '/' + c.maxHp + ' 进度=' + c.progress + '% 心境=' + w.RP.chat.moodOf(c.affinity).name +
          ' 全页背景=' + (d.body.dataset.scene === 'on' ? '✅' : '❌'));
        P('');
      }
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
