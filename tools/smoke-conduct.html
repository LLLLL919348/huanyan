<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 新机制测试：离去阶梯 / 废话回怼 / 固定轮次引导 / 全页面背景 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 测试专用：产品里没有模型就不允许对话，这里显式打开离线演绎当"假模型" */
  w.RP.engine.enableOfflineForHarness(true);
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  const AI = () => (conv().messages.filter(m => m.role === 'ai').slice(-1)[0] || {}).text || '';
  async function send(text) {
    const ta = d.getElementById('chatInput');
    if (!ta) { P('   !! 输入框不可用'); return false; }
    ta.value = text; ta.dispatchEvent(new w.Event('input'));
    d.getElementById('btnSend').click();
    await wait(2500); return true;
  }
  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
      const S = w.RP.settings.get();
      P('配置：guideEvery=' + S.plotRules.guideEvery + ' revealEnabled=' + S.plotRules.revealEnabled +
        ' 劝限=' + S.conduct.persuadeLimit + ' 废话限=' + S.conduct.offTopicLimit + ' 离去=' + S.conduct.leaveEnabled);
      P('权力关系：长安=' + w.RP.engine.powerOf(w.RP.resources.byId('changan-yeweiyang')) +
        '（可反击=' + w.RP.engine.canRetaliate(w.RP.resources.byId('changan-yeweiyang')) + '）  霓虹=' +
        w.RP.engine.powerOf(w.RP.resources.byId('nihong-jintou')) +
        '（可反击=' + w.RP.engine.canRetaliate(w.RP.resources.byId('nihong-jintou')) + '）');

      /* ---- A. 全页面背景 ---- */
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      P('A) 全页面背景：body[data-scene]=' + d.body.dataset.scene +
        ' --page-1=' + d.body.style.getPropertyValue('--page-1') +
        ' | 侧栏也吃到了？ ' + (w.getComputedStyle(d.querySelector('.sidebar')).backgroundImage.indexOf('gradient') > -1));

      /* ---- B. 固定轮次引导（第 5 轮）不推进度 ---- */
      const before = { p: conv().progress, t: conv().turn };
      for (let i = 0; i < 5; i++) await send('（我把手按在灯梯上，等她把话说完）');
      const nudges = conv().messages.filter(m => m.beat ? false : (m.meta && m.meta.nudge)).length;
      const nudgeInLine = /顿了顿|随口提起|敲了两下|推了半寸|瞥了一眼/.test(AI()) ? 1 : 0;
      P('B) 打到第 ' + conv().turn + ' 轮：自动引导 ' + nudges + ' 次；台词内引导句 ' + nudgeInLine +
        ' 次；推进度 ' + before.p + '→' + conv().progress + '（A 类不加推进度）');
      P('   最后一条 AI 结尾 = ' + JSON.stringify(AI().slice(-46)));
      P('   第 5 轮节点文本 = ' + JSON.stringify((conv().messages.filter(m => m.role === 'beat').slice(-1)[0] || {}).text || '').slice(0, 60));

      /* ---- C. 不能反击的角色（长安：玩家地位更高）→ 先劝后走 ---- */
      P('C) 长安夜未央（玩家是官身，角色不能反击）：');
      await send('滚开，你这废物，别挡着我办事。');
      P('   第 1 次冒犯：劝=' + conv().persuade + ' hp=' + conv().hp + ' 台词=' + AI().slice(0, 26) + '…');
      await send('我说了滚开，你算个什么东西。');
      P('   第 2 次冒犯：劝=' + conv().persuade + ' hp=' + conv().hp);
      await send('再废话我拆了你这灯棚。');
      P('   第 3 次冒犯：left=' + !!conv().left + ' 离去卡=' + d.querySelectorAll('.execution.leave').length +
        ' 面板=' + (d.querySelector('#composer .locked-panel h4') ? d.querySelector('#composer .locked-panel h4').textContent : '无'));
      P('   离去台词 = ' + JSON.stringify(AI()).slice(0, 70));

      /* ---- D. 能反击的角色（霓虹：平等）→ 回怼 ---- */
      w.RP.app.play('nihong-jintou');
      await wait(700);
      P('D) 霓虹尽头（可反击）：连续说与剧情无关的废话');
      await send('今天天气不错啊。');
      await send('你平时喜欢吃什么？');
      await send('我觉得你这铺子装修得一般。');
      P('   连续 3 轮废话后：offTopic 已触发，好感=' + conv().affinity + ' left=' + !!conv().left);
      P('   最后一句 AI = ' + JSON.stringify(AI()).slice(0, 60));
      const hasRetort = /逐客|闲话|消遣|正事/.test(d.body.innerHTML);
      P('   出现回怼语气 = ' + hasRetort);
      await send('滚开，废物，砸了你这破铺子。');
      P('   冒犯后（可反击）：hp=' + conv().hp + ' warned=' + conv().warned + ' left=' + !!conv().left + '（应走惩戒而非离去）');

      /* ---- E. 不能反击 + 极端侮辱 → 不再劝，当场走 ---- */
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      P('E) 长安 + 极端侮辱（应跳过劝说直接离去）：');
      await send('我操你妈，你算个什么东西。');
      P('   left=' + !!conv().left + ' 劝=' + (conv().persuade || 0) + '（应为 0 / undefined）） 离去卡=' +
        d.querySelectorAll('.execution.leave').length);

      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
