<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 复现用户反馈：短问句被模板答非所问 + 旁白被缝进角色台词 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 测试专用：产品里没有模型就不允许对话，这里显式打开离线演绎当"假模型" */
  w.RP.engine.enableOfflineForHarness(true);
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  const lastAI = () => {
    const el = Array.from(d.querySelectorAll('.msg-row.ai .bubble')).slice(-1)[0];
    return el ? el.textContent : '';
  };
  async function send(text) {
    const ta = d.getElementById('chatInput');
    if (!ta) { P('   !! 输入框不可用'); return false; }
    ta.value = text; ta.dispatchEvent(new w.Event('input'));
    d.getElementById('btnSend').click();
    await wait(2500); return true;
  }
  function countNumWord(s) {
    const m = /这([一二两三四五六七八九十]+)个字/.exec(s);
    return m ? m[1] : null;
  }
  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
      w.RP.app.play('changan-yeweiyang');
      await wait(700);

      /* 1. 短问句「是你？」——不该被套进写死的「这三个字」模板 */
      await send('是你？');
      const a1 = lastAI();
      P('1) 输入「是你？」（2 字）');
      P('   角色回复：' + JSON.stringify(a1.slice(0, 80)));
      const nw = countNumWord(a1);
      P('   量词检查：出现「这' + (nw || '?') + '个字」' + (nw === null ? '（未出现，OK）' : (nw === '两' ? '（正确）' : '（❌ 与 2 字不符）')));
      P('   是否答非所问（把「是你」当成重要证据）：' + (a1.indexOf('十年没听人当面提过') > -1 ? '❌ 仍在硬套剧情模板' : '✅ 已改为先接住这句话'));

      /* 2. 引导回合：旁白必须独立成条，不许缝进角色台词 */
      P('2) 打到引导回合（第 5 轮）看旁白与台词是否分离');
      for (let i = 0; i < 4; i++) await send('（我把手按在灯梯上，等着她说话）');
      const aiEl = Array.from(d.querySelectorAll('.msg-row.ai .bubble')).slice(-1)[0];
      const beats = Array.from(d.querySelectorAll('.beat span')).map(x => x.textContent);
      const lastBeat = beats.slice(-1)[0] || '';
      const aiText = aiEl ? aiEl.textContent : '';
      P('   旁白条数 = ' + beats.length + '，最后一条旁白 = ' + JSON.stringify(lastBeat.slice(0, 46)));
      P('   角色台词 = ' + JSON.stringify(aiText.slice(-60)));
      P('   旁白是否混进台词：' + (aiText.indexOf('卖糖人') > -1 || aiText.indexOf('铜铃') > -1 || aiText.indexOf('老翁') > -1 ? '❌ 仍混在一起' : '✅ 已分离'));
      P('   台词里是否只剩「角色自己的话」：' + (/（[^）]*%CHAR%|（沈明烛/.test(aiText) || aiText.indexOf('像是随口提起') > -1 || aiText.indexOf('顿了顿') > -1 ? '✅ 是' : '（本轮可能是普通回复）'));

      /* 3. 正常提问仍然要答到点上 */
      await send('十年前御史台那桩灭门案，卷宗少了一页。那一页是不是在你手上？');
      P('3) 正常长问句回复：' + JSON.stringify(lastAI().slice(0, 76)));

      /* 4. 两字关键词走「你问的是「××」」模板时，量词必须跟着变 */
      await send('卷宗？');
      const a4 = lastAI();
      const nw4 = countNumWord(a4);
      P('4) 输入「卷宗？」（2 字实词）：' + JSON.stringify(a4.slice(0, 70)));
      P('   量词 = ' + (nw4 === null ? '未出现' : '这' + nw4 + '个字') +
        (nw4 === null || nw4 === '两' ? ' ✅' : ' ❌ 应为「这两个字」'));
      await send('沈明烛，你手上那份东西到底是哪来的？');
      const a5 = lastAI();
      P('5) 三字以上关键词：' + JSON.stringify(a5.slice(0, 60)) +
        ' 量词=' + (countNumWord(a5) || '未出现'));

      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
