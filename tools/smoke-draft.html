<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 草稿保持测试：输入 → 切会话 → 切板块 → 切回来，文本是否还在 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 测试专用：产品里没有模型就不允许对话，这里显式打开离线演绎当"假模型" */
  w.RP.engine.enableOfflineForHarness(true);
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const input = () => d.getElementById('chatInput');
  const type = (t) => { const el = input(); el.value = t; el.dispatchEvent(new w.Event('input')); };
  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);

      /* 开场两场会话 */
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      const convA = w.RP.store.active().id;
      const textA = '这是我打到一半的一句，切走再切回来不能丢。';
      type(textA);
      await wait(400);                                   // 等草稿落 sessionStorage
      P('A 会话输入后：' + JSON.stringify(input().value.slice(0, 20)) + '…');

      /* 切到另一场会话 */
      w.RP.app.play('nihong-jintou');
      await wait(700);
      const convB = w.RP.store.active().id;
      P('切到 B 会话后，输入框内容 = ' + JSON.stringify(input().value) + '（应为空）');
      const textB = 'B 这边也写一句。';
      type(textB);
      await wait(300);

      /* 切板块：对话 → 资源 → 我的 → 对话 */
      w.RP.app.setView('resources'); await wait(300);
      w.RP.app.setView('profile');   await wait(300);
      w.RP.app.setView('chat');      await wait(400);
      P('切板块回来（B）：' + JSON.stringify(input().value) + ' → ' + (input().value === textB ? '✅ 保留' : '❌ 丢了'));

      /* 从侧栏切回 A */
      const itemA = d.querySelector('.conv-item[data-id="' + convA + '"]');
      itemA.click();
      await wait(500);
      const valA = input() ? input().value : '(无输入框)';
      P('侧栏切回 A：' + JSON.stringify(valA) + ' → ' + (valA === textA ? '✅ 保留' : '❌ 丢了'));
      P('两场草稿互不串台：' + (valA === textA && w.RP.store.active().id === convA ? '✅' : '❌'));

      /* 刷新页面（重载 iframe）后草稿是否还在 */
      const stored = w.sessionStorage.getItem('rp_drafts_v1');
      P('草稿已落 sessionStorage：' + (/这是|B 这边/.test(stored || '') ? '✅' : '❌'));

      /* 发送后应清空 */
      const ta = input(); ta.value = textA; ta.dispatchEvent(new w.Event('input'));
      d.getElementById('btnSend').click();
      await wait(2600);
      P('发送后输入框 = ' + JSON.stringify(input().value) + ' → ' + (input().value === '' ? '✅ 已清空' : '❌ 未清空'));
      P('消息确实发出：' + (w.RP.store.active().messages.filter(function (m) { return m.role === 'user'; }).length > 0 ? '✅' : '❌'));
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
