<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!--
  额度/模型来源验收（2026-10-22 站点不再自营模型之后重写）

  以前这套测的是「站长模型每日 30 次、用完弹面板」。现在站点不提供模型，
  这套测的是新的事实：
    ① /api/model 明确报告 serverModel=false（本站没有模型）
    ② 没配自己的 Key 时：对话区是「先填一个你自己的模型 Key」面板，没有输入框
    ③ 面板写明了本站不提供模型、费用由用户和服务商结算、默认浏览器直连
    ④ 配上自己的 Key 之后：显示「你自己的模型 · 不占额度」，且没有任何额度数字
    ⑤ 页面上不再出现「今日额度剩余」「今日额度已用完」
    ⑥ 「我的」页显示「对话不限次数 / 不限」，store 里 dailyQuota=0
-->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => { log.push(s); document.getElementById('out').textContent = log.join('\n'); };
let fails = 0;
function ok(cond, label, extra) { if (cond) P('  ✓ ' + label); else { fails++; P('  ✗ ' + label + (extra ? ' — ' + extra : '')); } }
const f = document.getElementById('f');
f.addEventListener('load', function () {
  if (window.__qStarted) return;
  window.__qStarted = true;
  const w = f.contentWindow, d = f.contentDocument;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const composer = () => d.getElementById('composer');

  (async function () {
    try {
      for (let i = 0; i < 80 && !d.querySelector('.res-card'); i++) await wait(200);
      const list = w.RP.resources.list().filter(r => r.status === 'playable');

      /* 验收页会被 app.js 自动塞一个假模型（别的套件要用），这里先清掉 */
      const st0 = w.RP.store.get();
      st0.api = { enabled: false, base: '', key: '', model: '', temp: 0.85, direct: true };
      st0.user.quota = { daily: 0, used: 0, day: w.RP.util.dayKey() };
      w.RP.store.save();
      window.__clearedModel = 1;

      P('【① 本站不提供模型】');
      const m = w.RP.api.serverInfo();
      ok(m.serverModel === false, '/api/model 说 serverModel=false', JSON.stringify(m.serverModel));
      ok(w.RP.api.mode() === 'none', '没有配置时 mode() 是 none', w.RP.api.mode());

      P('【② 没模型的对话区】');
      w.RP.app.play(list[0].id);
      await wait(700);
      const panel = composer().querySelector('.locked-panel.need-model');
      ok(!!panel, '输入区是「需要模型」面板');
      ok(!composer().querySelector('#chatInput'), '没有输入框');
      ok(!composer().querySelector('#btnSend'), '没有发送按钮');

      P('【③ 面板把「谁提供服务」写清楚了】');
      const txt = panel ? panel.textContent : '';
      ok(/本站不提供 AI 模型/.test(txt), '写明本站不提供 AI 模型');
      ok(/你自己填的那家大模型|调用你自己填/.test(txt), '写明用的是用户自己填的模型');
      ok(/不经手/.test(txt), '写明费用其实不经手、不抽成');
      ok(/去填写 Key/.test(txt), '有「去填写 Key」按钮');
      ok(/浏览器直连/.test(txt), '说明了默认浏览器直连');
      ok(/经本站转发/.test(txt), '说明了受限时可开转发');

      P('【④ 填了自己的 Key：不占额度、也没有额度数字】');
      const st = w.RP.store.get();
      st.api = { enabled: true, base: 'http://127.0.0.1:9/v1', key: 'test-key', model: 'fake-model', temp: 0.85, direct: true };
      w.RP.store.save();
      w.RP.chat.renderComposer();
      await wait(300);
      const hint = composer().querySelector('.composer-hint');
      const hintTxt = hint ? hint.textContent : '';
      ok(/你自己的模型/.test(hintTxt), '提示写明「你自己的模型」', hintTxt.slice(0, 60));
      ok(/不占额度/.test(hintTxt), '提示写明「不占额度」');
      ok(!/今日额度剩余/.test(hintTxt), '不再显示「今日额度剩余」');
      ok(!!composer().querySelector('#chatInput'), '输入框回来了');

      P('【⑤ 不再有旧的额度文案】');
      const pageText = d.body.textContent;
      ok(!/今日额度已用完/.test(pageText), '没有「今日额度已用完」面板');
      ok(!/每日额度 \d+/.test(pageText), '没有「每日额度 N」字样');

      P('【⑥ 「我的」页：不限次数】');
      w.RP.app.setView('profile');
      await wait(400);
      const pf = d.getElementById('view-profile').textContent;
      ok(/对话不限次数|不限/.test(pf), '「我的」里显示不限次数');
      const daily = w.RP.store.get().user.quota.daily;
      ok(daily === 0, 'store 里 dailyQuota=0（0 表示不限）', String(daily));

      P('');
      P(fails === 0 ? '=== 全部通过 ===' : '=== 失败 ' + fails + ' 项 ===');
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); P('=== 完成 ==='); }
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
