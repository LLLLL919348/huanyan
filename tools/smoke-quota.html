<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 每日额度冒烟测试：20 次上限 / 只有本站模型吃额度 / 用尽时的替代出口 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
let fails = 0;
function ok(cond, label, extra) { if (cond) P('  ✓ ' + label); else { fails++; P('  ✗ ' + label + (extra ? ' — ' + extra : '')); } }
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('error', function (e) { log.push('!! error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); fails++; });
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); fails++; });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  const quota = () => w.RP.store.get().user.quota;
  const composer = () => d.getElementById('composer');

  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);

      /* ---- 1. 额度上限来自站点设置，不是硬编码的旧值 ---- */
      P('【额度上限】');
      const Q = w.RP.settings.get().site.dailyQuota;
      ok(quota().daily === Q, '每日额度跟随后台设置（' + Q + '）', '实际 ' + quota().daily);
      ok(Q === 30, '当前配置为 30 次/人/天', '实际 ' + Q);

      /* ---- 2. 没有模型 = 不能对话（产品铁律：对话必须由模型主导） ---- */
      P('【没有模型时不能对话】');
      ok(w.RP.api.mode() === 'none', '当前没有可用模型 → none', w.RP.api.mode());
      ok(w.RP.engine.offlineDialogue() === false, '离线演绎默认关闭');
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      quota().used = 0; w.RP.store.save();
      ok(!!d.querySelector('#composer .locked-panel.need-model'), '输入区是「本场需要模型才能开始」面板');
      ok(!d.getElementById('chatInput'), '没有输入框，发不出话');
      /* 就算绕过界面直接调发送，也必须只留一条固定提示、不产生任何角色台词 */
      const before2 = conv().messages.length;
      await w.RP.chat.sendMessage(conv(), w.RP.resources.byId('changan-yeweiyang'), '十年前御史台那桩案子，卷宗少了一页。');
      await wait(800);
      const added = conv().messages.slice(before2);
      ok(added.every(function (m) { return m.role !== 'ai'; }), '没有生成任何角色台词', JSON.stringify(added.map(function (m) { return m.role; })));
      ok(added.some(function (m) { return m.role === 'notice' && /本场需要模型才能继续/.test(m.text); }), '只给了一条固定提示');
      ok(quota().used === 0, '没有扣额度', 'used=' + quota().used);

      /* ---- 3. 假装用本站模型：吃额度 + 用尽后的出口 ---- */
      P('【本站模型 · 额度用尽】');
      const realMode = w.RP.api.mode;
      w.RP.api.mode = function () { return 'server'; };
      /* serverReady/ serverInfo 也要装作有 */
      const realReady = w.RP.api.serverReady, realInfo = w.RP.api.serverInfo;
      w.RP.api.serverReady = function () { return true; };
      w.RP.api.serverInfo = function () { return { serverModel: true, model: 'deepseek-chat', dailyQuota: Q, quota: { left: 0, limit: Q } }; };

      quota().used = 12; w.RP.store.save();
      w.RP.chat.renderComposer();
      await wait(120);
      ok(composer().querySelectorAll('.locked-panel.quota').length === 0, '还有额度时不显示额度面板');
      ok(!d.getElementById('btnSend').disabled, '还有额度时发送按钮可用');
      ok(/今日额度剩余/.test(composer().innerHTML), '显示「今日额度剩余」');
      ok(/本站模型/.test(composer().innerHTML), '标注这是本站模型（吃额度）');
      /* 额度只能有一处显示：以前左边「今日额度剩余」+ 右边「本站额度剩余」两套计数会互相矛盾 */
      const hint = composer().querySelector('.composer-hint');
      const quotaMentions = (hint ? hint.innerHTML.match(/额度/g) || [] : []).length;
      ok(quotaMentions === 1, '输入区上方只出现一处「额度」（实际 ' + quotaMentions + ' 处）', hint ? hint.textContent.slice(0, 120) : '');
      ok(!/本站额度剩余/.test(composer().innerHTML), '不再重复显示第二份额度');

      quota().used = Q; w.RP.store.save();
      w.RP.chat.renderComposer();
      await wait(120);
      const panel = composer().querySelector('.locked-panel.quota');
      ok(!!panel, '额度用尽时出现提示面板');
      ok(!!panel && /今日额度已用完/.test(panel.textContent), '面板写明「今日额度已用完」');
      ok(!!panel && /不占站内额度/.test(panel.textContent), '面板说明自带模型不占额度');
      ok(d.getElementById('btnSend').disabled === true, '额度用尽时发送按钮禁用');

      /* 点「去配置我自己的模型」应跳到「我的」并展开模型面板 */
      let jumped = false;
      if (panel) {
        const go = d.getElementById('btnQuotaModel');
        ok(!!go, '面板里有「去配置我自己的模型」按钮');
        if (go) {
          go.click();
          await wait(400);
          jumped = w.RP.store.get().ui.view === 'profile' && w.RP.store.get().ui.openAcc.sys === true;
        }
      }
      ok(jumped, '点击后跳到「我的」并展开「模型与安全」');

      /* ---- 4. 自带模型：不占额度，也不受上限拦截 ---- */
      P('【自带模型不吃额度】');
      w.RP.api.mode = function () { return 'own'; };
      w.RP.store.get().api = Object.assign(w.RP.store.get().api || {}, {
        enabled: true, base: 'https://api.deepseek.com/v1', key: 'sk-test', model: 'deepseek-chat'
      });
      w.RP.store.save();
      w.RP.app.setView('chat');
      await wait(300);
      w.RP.chat.renderComposer();
      await wait(120);
      ok(composer().querySelectorAll('.locked-panel.quota').length === 0, '额度已用尽但仍不挡自带模型');
      ok(!d.getElementById('btnSend').disabled, '自带模型时发送按钮可用');
      ok(/你自己的模型 · 不占额度/.test(composer().innerHTML), '标注「你自己的模型 · 不占额度」');
      ok(quota().used === Q, '额度数字保持不变（不扣）', 'used=' + quota().used);

      w.RP.api.mode = realMode; w.RP.api.serverReady = realReady; w.RP.api.serverInfo = realInfo;
      w.RP.store.get().api.enabled = false; w.RP.store.save();

      /* ---- 5.「我的 → 模型与安全」面板本身可用 ---- */
      P('【模型与安全面板】');
      const st2 = w.RP.store.get();
      st2.ui.view = 'profile';
      st2.ui.openAcc.sys = true;
      w.RP.store.save();
      w.RP.app.setView('profile');
      await wait(500);
      const pv = d.getElementById('view-profile');
      ok(!!pv, '「我的」视图渲染出来');
      ['apiBase', 'apiPreset', 'apiKey', 'apiModel', 'apiTemp', 'apiSave', 'apiTest', 'apiDirect', 'apiScan'].forEach(function (id) {
        ok(!!(pv && pv.querySelector('#' + id)), '面板里有 #' + id);
      });
      const presets = pv ? pv.querySelectorAll('#apiPreset option').length : 0;
      ok(presets >= 12, '供应商下拉至少有 11 个预设 + 占位项', '实际 ' + presets);
      /* 「现在是谁在说话」：来源一眼可见 + 换成云端的步骤 */
      const now = pv && pv.querySelector('.api-now');
      ok(!!now, '面板顶部有「现在是谁在说话」');
      ok(!!now && /本机|云端|还没有模型/.test(now.querySelector('.an-badge').textContent),
        '标签写明模型来源', now ? now.querySelector('.an-badge').textContent : '无');
      ok(!!pv.querySelector('.api-quick'), '有「换成云端大模型」的步骤说明');
      /* 选一个供应商应自动填好地址与模型名 */
      const sel = pv && pv.querySelector('#apiPreset');
      if (sel) {
        const opt = Array.prototype.filter.call(sel.options, function (o) { return o.value === 'deepseek'; })[0];
        if (opt) {
          sel.value = 'deepseek';
          sel.dispatchEvent(new w.Event('change', { bubbles: true }));
          await wait(300);
          const base = pv.querySelector('#apiBase').value, model = pv.querySelector('#apiModel').value;
          ok(/deepseek\.com/.test(base) && !!model, '选 DeepSeek 后自动填好地址与模型名', base + ' / ' + model);
        }
      }
      /* 测试连接：地址不合法时必须给出可见的错误，而不是静默失败 */
      const tbtn = pv && pv.querySelector('#apiTest');
      if (tbtn) {
        pv.querySelector('#apiBase').value = 'http://example.com/v1';
        pv.querySelector('#apiModel').value = 'gpt-4o-mini';
        tbtn.click();
        await wait(2500);
        const res = pv.querySelector('#apiTestResult');
        ok(!!res && res.textContent.trim().length > 0, '「测试连接」会回显结果', res ? res.textContent.trim().slice(0, 60) : '无');
      }

      P(fails === 0 ? '=== 全部通过 ===' : '=== 失败 ' + fails + ' 项 ===');
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); P('=== 完成 ==='); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
