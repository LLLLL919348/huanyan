<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 新规则冒烟测试：剧情规则 / 行为规则 / 积分 / 道具引用 / 即死 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  /* 测试专用：产品里没有模型就不允许对话，这里显式打开离线演绎当"假模型" */
  w.RP.engine.enableOfflineForHarness(true);
  /* 固定成"没有模型"：这类测试只验裁决与界面，不受本机装没装模型影响 */
  w.RP.api.mode = function () { return 'none'; };   // forceNoModel
  w.addEventListener('error', function (e) { log.push('!! iframe error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  w.addEventListener('unhandledrejection', function (e) { log.push('!! iframe rejection: ' + ((e.reason && e.reason.stack) || e.reason)); });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  const AI = () => (conv().messages.filter(m => m.role === 'ai').slice(-1)[0] || {}).text || '';
  async function send(text) {
    const ta = d.getElementById('chatInput');
    if (!ta) { P('!! 输入框不可用'); return false; }
    ta.value = text; ta.dispatchEvent(new w.Event('input'));
    d.getElementById('btnSend').click();
    await wait(2600); return true;
  }
  async function passMute(n) {
    let i = 0;
    while (d.getElementById('btnSilent') && i < (n || 4)) { d.getElementById('btnSilent').click(); await wait(2600); i++; }
    return i;
  }
  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
      const st = w.RP.store.get();
      P('初始积分: ' + st.score + ' | 初始道具: ' + JSON.stringify(st.inventory));

      /* ---- 1. 生命值 20 ---- */
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      P('1) 新会话 hp=' + conv().hp + '/' + conv().maxHp + ' | 提醒卡 ' +
        d.querySelectorAll('.reminder ol li').length + ' 条 + 规则 ' + d.querySelectorAll('.reminder-rules li').length + ' 条');
      P('   composer 里: input=' + !!d.getElementById('chatInput') + ' send=' + !!d.getElementById('btnSend') +
        ' items=' + !!d.getElementById('btnItems'));
      var H = d.getElementById('composer').innerHTML.replace(/\s+/g, ' ');
      P('   composer 尾部: ' + H.slice(-360));
      P('   含 send-btn: ' + /send-btn/.test(H) + ' 含 item-btn: ' + /item-btn/.test(H) + ' 长度 ' + H.length);

      /* ---- 2. 空转不算推进 ---- */
      const p0 = conv().progress, a0 = conv().affinity;
      await send('嗯'); await send('哦'); await send('这样啊');
      P('2) 空转 3 轮：推进度 ' + p0 + '→' + conv().progress + '（应基本不变），好感 ' + a0 + '→' + conv().affinity + '（不应涨）');

      /* ---- 3. 有效剧情问话 ---- */
      const p1 = conv().progress, a1 = conv().affinity;
      await send('十年前御史台那桩灭门案，卷宗少了一页。沈明烛，那一页是不是在你手上？');
      P('3) 剧情问话：推进度 ' + p1 + '→' + conv().progress + '，好感 ' + a1 + '→' + conv().affinity + '（都应上涨）');

      /* ---- 4. 积分里程碑 ---- */
      const evs = [];
      w.RP.chat.achievement(conv(), w.RP.resources.byId('changan-yeweiyang'), 60, evs);
      P('4) 推进到 ' + conv().progress + '%：' + evs.filter(e => e.role === 'notice').map(e => e.text).join(' ｜ '));
      P('   当前积分 = ' + w.RP.store.get().score + ' | 领取记录 = ' + JSON.stringify(w.RP.store.get().claims));

      /* ---- 5. 通关 + 只发一次 ---- */
      const evs2 = [];
      w.RP.chat.achievement(conv(), w.RP.resources.byId('changan-yeweiyang'), 40, evs2);
      const vic = evs2.filter(e => e.role === 'victory')[0];
      P('5) 通关：' + (vic ? vic.meta.sub : '未触发') + ' | 积分 = ' + w.RP.store.get().score);
      const beforeScore = w.RP.store.get().score;
      const evs3 = [];
      w.RP.chat.achievement(conv(), w.RP.resources.byId('changan-yeweiyang'), 0, evs3);
      P('   再次通关检查：积分 ' + beforeScore + ' → ' + w.RP.store.get().score + '（应不变），胜利卡再触发 ' + evs3.filter(e => e.role === 'victory').length + ' 次（应为 0）');

      /* ---- 6. 道具：购买 → 引用 → 随台词发出 ---- */
      const inv0 = w.RP.store.itemCount('hourglass');
      const bought = w.RP.store.buy('hourglass');
      P('6) 购买回溯沙漏：' + bought.msg + ' | 数量 ' + inv0 + '→' + w.RP.store.itemCount('hourglass') + ' | 积分 ' + w.RP.store.get().score);
      conv().hp = 6; w.RP.store.save(); w.RP.chat.renderStats();
      // 通过界面引用：点道具按钮 → 选第一项
      d.getElementById('btnItems').click();
      await wait(200);
      const first = d.querySelector('#popEl .popover-item[data-pick]');
      P('   道具面板项数 = ' + d.querySelectorAll('#popEl .popover-item[data-pick]').length);
      first.click(); await wait(200);
      P('   引用后输入区 chip = ' + (d.querySelector('.attached-chip') ? d.querySelector('.attached-chip').textContent.trim() : '无'));
      await send('我把它放在桌上，你看清了吗？');
      const lastUser = conv().messages.filter(m => m.role === 'user').slice(-1)[0];
      P('   消息带道具 = ' + JSON.stringify((lastUser.items || []).map(i => i.name)) +
        ' | 剩余数量 = ' + w.RP.store.itemCount('hourglass') +
        ' | 状态值 = ' + conv().hp + '/' + conv().maxHp);
      P('   AI 是否对道具有反应 = ' + /（[^）]*）/.test(AI().slice(0, 40)));

      /* ---- 7. 口述道具不算 ---- */
      const invBefore = w.RP.store.itemCount('shield');
      await send('我掏出免罚金牌拍在桌上。');
      P('7) 口述使用免罚金牌：数量 ' + invBefore + '→' + w.RP.store.itemCount('shield') + '（应不变），会话 shield 标记 = ' + !!conv().shield);

      /* ---- 8. 即死规则（可反击的角色）---- */
      w.RP.app.play('nihong-jintou');
      await wait(700);
      conv().hp = 20; conv().warned = 1; w.RP.store.save();
      await send('我操你妈，我要弄死你全家。');
      P('8) 严重恶意侮辱（霓虹·可反击）：hp=' + conv().hp + ' muted=' + conv().muted + ' 处刑节点=' + d.querySelectorAll('.execution').length +
        ' | 即死台词=' + /act-instant/.test(d.body.innerHTML));
      P('   行为台词 = ' + (/〔即死/.test(AI()) ? '用了即死台词' : AI().slice(0, 30)));
      P('   最近消息角色 = ' + conv().messages.slice(-5).map(m => m.role).join(' → '));
      P('   禁言面板 = ' + (d.querySelector('#composer .locked-panel h4') ? d.querySelector('#composer .locked-panel h4').textContent : '无'));

      /* ---- 9. 反制道具 ---- */
      w.RP.app.play('nihong-jintou');
      await wait(700);
      w.RP.store.get().score = 900; w.RP.store.save();
      w.RP.store.buy('blade');
      d.getElementById('btnItems').click(); await wait(200);
      const bladeBtn = Array.from(d.querySelectorAll('#popEl .popover-item[data-pick]')).filter(b => /逆言/.test(b.textContent))[0];
      if (bladeBtn) { bladeBtn.click(); await wait(200); }
      const affBefore = conv().affinity;
      await send('你到底在替谁做事？');
      P('9) 反制道具：好感 ' + affBefore + '→' + conv().affinity + '，反噬/屈服节点=' +
        (d.body.innerHTML.indexOf('反噬') > -1 || d.body.innerHTML.indexOf('屈服') > -1));

      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
