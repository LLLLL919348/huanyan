<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>pending</title>
<style>html,body{margin:0;height:100%}iframe{width:100%;height:100%;border:0}
#out{position:fixed;left:0;top:0;right:0;max-height:100%;overflow:auto;background:#fff;color:#111;
font:12px/1.6 Consolas,monospace;margin:0;padding:8px;white-space:pre-wrap;z-index:9}</style></head>
<body>
<!-- 界面测试：全屏沉浸 / 字号字体设置 / 行为台词的恐怖升级 -->
<iframe id="f" src="../index.html"></iframe>
<pre id="out">running…</pre>
<script>
const log = []; const P = s => log.push(s);
let fails = 0;
function ok(cond, label, extra) { if (cond) P('  ✓ ' + label); else { fails++; P('  ✗ ' + label + (extra ? ' — ' + extra : '')); } }
document.getElementById('f').addEventListener('load', function () {
  const w = this.contentWindow, d = this.contentDocument;
  w.addEventListener('error', function (e) { log.push('!! error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); fails++; });
  w.addEventListener('unhandledrejection', function (e) { log.push('!! rejection: ' + ((e.reason && e.reason.stack) || e.reason)); fails++; });
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const conv = () => w.RP.store.active();
  const cs = el => w.getComputedStyle(el);

  (async function () {
    try {
      for (let i = 0; i < 60 && !d.querySelector('.res-card'); i++) await wait(200);
      /* 固定成"没有模型"+离线演绎：这类测试只验界面，不受本机装没装模型影响 */
      w.RP.engine.enableOfflineForHarness(true);
      w.RP.api.mode = function () { return 'none'; };

      /* ---- 1. 字号设置 ---- */
      P('【字号】');
      const basePx = parseFloat(cs(d.body).fontSize);
      w.RP.store.get().ui.font = { size: 'std', family: 'system' };
      w.RP.store.save(); w.RP.app.applyFont();
      await wait(80);
      ok(Math.abs(parseFloat(cs(d.body).fontSize) - 14) < 0.6, '标准字号 = 14px', cs(d.body).fontSize);
      w.RP.store.get().ui.font.size = 'xl';
      w.RP.store.save(); w.RP.app.applyFont();
      await wait(80);
      const bigPx = parseFloat(cs(d.body).fontSize);
      ok(bigPx > 15.5, '切换到「特大」后正文变大', bigPx + 'px（原本 ' + basePx + '）');
      ok(d.body.dataset.fontSize === 'xl', 'body 上带上了 data-font-size=xl', d.body.dataset.fontSize);
      w.RP.store.get().ui.font.size = 'std';
      w.RP.store.save(); w.RP.app.applyFont();

      /* ---- 2. 字体设置 ---- */
      P('【字体】');
      const defFamily = cs(d.body).fontFamily;
      w.RP.store.get().ui.font.family = 'kai';
      w.RP.store.save(); w.RP.app.applyFont();
      await wait(80);
      const kai = cs(d.body).fontFamily;
      ok(kai !== defFamily, '切换字体后 font-family 真的变了');
      ok(/KaiTi|Kaiti|STKaiti|楷/i.test(kai), '选了楷体后字体栈里有楷体', kai.slice(0, 60));
      ok(d.body.dataset.font === 'kai', 'body 上带着 data-font=kai');
      w.RP.store.get().ui.font.family = 'system';
      w.RP.store.save(); w.RP.app.applyFont();

      /* ---- 3. 我的界面里的字号/字体面板 ---- */
      P('【我的 → 字号与字体】');
      const st = w.RP.store.get();
      st.ui.view = 'profile';
      Object.keys(st.ui.openAcc).forEach(function (k) { st.ui.openAcc[k] = (k === 'type'); });
      w.RP.store.save();
      w.RP.app.setView('profile');
      await wait(400);
      const pv = d.getElementById('view-profile');
      ok(!!pv.querySelector('[data-key="type"]'), '「我的」里有「字号与字体」分组');
      ok(pv.querySelectorAll('[data-fontsize]').length === 6, '6 档字号可选', String(pv.querySelectorAll('[data-fontsize]').length));
      ok(pv.querySelectorAll('[data-fontfamily]').length === 6, '6 种字体可选', String(pv.querySelectorAll('[data-fontfamily]').length));
      ok(!!pv.querySelector('.font-preview'), '面板里有实时预览');
      const xlBtn = pv.querySelector('[data-fontsize="lg"]');
      if (xlBtn) {
        xlBtn.click();
        await wait(500);
        ok(w.RP.store.get().ui.font.size === 'lg', '点「大」写进了设置', w.RP.store.get().ui.font.size);
        ok(parseFloat(cs(d.body).fontSize) > 14.5, '界面字号立刻生效', cs(d.body).fontSize);
      }
      const songBtn = pv.querySelector('[data-fontfamily="song"]');
      if (songBtn) {
        songBtn.click();
        await wait(500);
        ok(w.RP.store.get().ui.font.family === 'song', '点「宋体」写进了设置');
      }
      w.RP.store.get().ui.font = { size: 'std', family: 'system' };
      w.RP.store.save(); w.RP.app.applyFont();

      /* ---- 4. 全屏沉浸 ---- */
      P('【全屏沉浸】');
      ok(d.body.dataset.focus !== '1', '刚进站点不是全屏（绝不自动进）');
      /* 回归护栏：对话视图必须是「绝对定位 + 固定高度」，
         一旦被别的 ID 规则改成 relative，消息区就失去可滚动高度（滚轮失灵、像卡死） */
      ok(cs(d.getElementById('view-chat')).position === 'absolute',
        '非全屏时 #view-chat 是 absolute（消息区才能滚动）',
        cs(d.getElementById('view-chat')).position);
      ok(!d.getElementById('focusExit'), '非全屏时没有浮层退出按钮');
      ok(!!d.getElementById('btnFocusTop'), '顶栏右上角有全屏图标按钮');
      w.RP.app.play('changan-yeweiyang');
      await wait(700);
      ok(!!d.getElementById('btnFocus'), '对话页头部也有「全屏」按钮');
      const sidebarBefore = cs(d.querySelector('.sidebar')).display;
      const stageBefore = d.querySelector('.chat-stage').getBoundingClientRect().height;

      /* 进全屏：点顶栏图标 */
      d.getElementById('btnFocusTop').click();
      await wait(350);
      ok(d.body.dataset.focus === '1', '点顶栏图标进入全屏');
      ok(cs(d.querySelector('.sidebar')).display === 'none', '侧栏被让出来了', 'before=' + sidebarBefore);
      const topbar = d.querySelector('.topbar');
      ok(!topbar || cs(topbar).display === 'none', '顶栏隐藏');
      const exitBtn = d.getElementById('focusExit');
      ok(!!exitBtn, '全屏时出现浮层「退出全屏」按钮');
      if (exitBtn) {
        const r = exitBtn.getBoundingClientRect();
        ok(r.top < 90 && (w.innerWidth - r.right) < 90, '浮层按钮钉在右上角',
          'top=' + Math.round(r.top) + ' right=' + Math.round(w.innerWidth - r.right));
        ok(/Esc/.test(exitBtn.textContent), '按钮上标了 Esc 提示');
      }
      const stageH = d.querySelector('.chat-stage').getBoundingClientRect().height;
      ok(stageH >= w.innerHeight * 0.55, '对话区域至少占视口 55%',
        Math.round(stageH) + ' / ' + w.innerHeight + ' = ' + Math.round(stageH / w.innerHeight * 100) + '%');
      ok(cs(d.getElementById('view-chat')).position === 'fixed', '全屏时对话视图钉在视口上（position:fixed）');

      /* 出口 1：Esc */
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await wait(300);
      ok(d.body.dataset.focus === '0', 'Esc 退出全屏', d.body.dataset.focus);
      ok(!d.getElementById('focusExit'), '退出后浮层按钮被移除');
      ok(cs(d.querySelector('.sidebar')).display !== 'none', '侧栏回来了');

      /* 出口 2：浮层按钮 */
      w.RP.app.toggleFocus(true);
      await wait(250);
      ok(d.body.dataset.focus === '1', '再次进入全屏');
      d.getElementById('focusExit').click();
      await wait(300);
      ok(d.body.dataset.focus === '0', '点浮层按钮也能退出');

      /* 出口 3：浏览器自己退出全屏（Esc / F11）→ fullscreenchange 同步 */
      w.RP.app.toggleFocus(true);
      await wait(250);
      d.dispatchEvent(new w.Event('fullscreenchange'));
      w.dispatchEvent(new w.Event('fullscreenchange'));
      await wait(250);
      ok(d.body.dataset.focus === '0', '浏览器退出全屏时界面同步恢复（不怕「退不出来」）');

      /* 只认 Alt+F；单按 F 不再切换 */
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'f', bubbles: true }));
      await wait(200);
      ok(d.body.dataset.focus === '0', '单按 F 不会误触全屏');
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'f', altKey: true, bubbles: true }));
      await wait(250);
      ok(d.body.dataset.focus === '1', 'Alt+F 才切换全屏');
      d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await wait(250);

      /* 切到别的板块也会自动退出 */
      w.RP.app.toggleFocus(true);
      await wait(200);
      w.RP.app.setView('resources');
      await wait(300);
      ok(d.body.dataset.focus === '0', '切到资源区自动退出全屏');
      w.RP.app.setView('chat');
      await wait(300);

      /* ---- 5. 行为台词的恐怖升级 ---- */
      P('【行为台词 · 越重越大越恐怖】');
      const ta = d.getElementById('chatInput');
      const btn = d.getElementById('btnSend');
      async function send(text) {
        ta.value = text; ta.dispatchEvent(new w.Event('input', { bubbles: true }));
        btn.click(); await wait(2600);
      }
      await send('滚开，你这废物，别挡着我办事。');
      await send('我说了滚开，你算个什么东西。');
      const rows = Array.prototype.slice.call(d.querySelectorAll('#messages .msg-row[data-act-sev]'));
      ok(rows.length > 0, '制裁消息被打上 data-act-sev', String(rows.length));
      if (rows.length) {
        const sev = Number(rows[rows.length - 1].getAttribute('data-act-sev'));
        ok(sev >= 1, '严重度至少 1 级', String(sev));
        const bubble = rows[rows.length - 1].querySelector('.bubble');
        const plain = d.querySelector('#messages .msg-row.ai:not([data-act-sev]) .bubble');
        const sizeAct = parseFloat(cs(bubble).fontSize);
        const sizePlain = plain ? parseFloat(cs(plain).fontSize) : sizeAct - 1;
        ok(sizeAct > sizePlain, '带制裁的那句字号更大', sizeAct + 'px vs ' + (plain ? sizePlain + 'px' : '无对照'));
        ok(/act-stamp/.test(rows[rows.length - 1].innerHTML), '名字后面有制裁印章');
      }
      /* 行为台词本身的 data-sev 也要在 */
      const actEl = d.querySelector('#messages .bubble .act[data-sev]');
      ok(!!actEl, '行为台词元素带 data-sev', actEl ? actEl.getAttribute('data-sev') : '无');
      /* 冲击动画类：制裁落地时出现过 */
      P('  冲击类：' + (['impact-warn', 'impact-punish', 'impact-heavy', 'impact-fatal']
        .filter(function (c) { return d.getElementById('view-chat').classList.contains(c); }).join(',') || '（已经播完，正常）'));
      ok(typeof w.RP.acts.severity === 'function', 'RP.acts.severity 可用');
      ok(w.RP.acts.severity('instant') === 4 && w.RP.acts.severity('warn') === 1,
        '严重度映射：警告 1 / 即死 4');

      P(fails === 0 ? '=== 全部通过 ===' : '=== 失败 ' + fails + ' 项 ===');
      P('=== 完成 ===');
    } catch (e) { P('!! 异常：' + (e && e.stack ? e.stack : e)); P('=== 完成 ==='); }
    document.getElementById('out').textContent = log.join('\n');
    document.title = 'DONE';
  })();
});
</script>
</body>
</html>
